<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="voiceCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="n8nCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1525" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="aiCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2A4D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="toolCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="respCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134E4A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FB923C"/>
    </marker>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .header-title { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
    .header-sub { font-size: 13px; font-weight: 400; fill: #94A3B8; }
    .node-title { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
    .node-sub { font-size: 11.5px; font-weight: 500; fill: #94A3B8; }
    .node-detail { font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .edge-label { font-size: 11px; font-weight: 600; fill: #94A3B8; }
    .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
  </style>

  <!-- Background -->
  <rect width="1100" height="680" rx="14" fill="url(#archBg)" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Diagram Title Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="font-base header-title">End-to-End System Architecture &amp; Data Pipeline</text>
    <text x="0" y="20" class="font-base header-sub">How inbound phone calls trigger synchronous n8n workflows, LangChain reasoning, and API integrations</text>
  </g>

  <!-- ==================== SECTION 1: VOICE INGESTION (VAPI) ==================== -->
  <!-- Boundary Box -->
  <rect x="40" y="80" width="220" height="560" rx="12" fill="#0F172A" fill-opacity="0.5" stroke="#4338CA" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <rect x="55" y="68" width="130" height="22" rx="4" fill="#312E81"/>
  <text x="120" y="83" class="font-base badge" fill="#C7D2FE" text-anchor="middle">VOICE AI LAYER</text>

  <!-- Caller Node -->
  <g transform="translate(60, 110)" filter="url(#cardShadow)">
    <rect width="180" height="90" rx="8" fill="url(#voiceCard)" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="28" cy="28" r="14" fill="#6366F1" fill-opacity="0.2"/>
    <text x="28" y="32" class="font-base" font-size="14" text-anchor="middle">📞</text>
    <text x="50" y="27" class="font-base node-title">Inbound Caller</text>
    <text x="50" y="42" class="font-base node-sub">Real Estate Lead</text>
    <text x="16" y="66" class="font-base node-detail">• Audio streaming</text>
    <text x="16" y="80" class="font-base node-detail">• Inquires / Books viewing</text>
  </g>

  <!-- Vapi Assistant Node -->
  <g transform="translate(60, 245)" filter="url(#cardShadow)">
    <rect width="180" height="235" rx="8" fill="url(#voiceCard)" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="28" cy="28" r="14" fill="#6366F1" fill-opacity="0.2"/>
    <text x="28" y="32" class="font-base" font-size="14" text-anchor="middle">🎙️</text>
    <text x="50" y="27" class="font-base node-title">Vapi Assistant</text>
    <text x="50" y="42" class="font-base node-sub">"Ben" Receptionist</text>
    
    <line x1="16" y1="56" x2="164" y2="56" stroke="#4338CA" stroke-opacity="0.5"/>
    
    <text x="16" y="74" class="font-base node-detail" font-weight="600" fill="#A5B4FC">Speech-to-Text:</text>
    <text x="16" y="89" class="font-base node-detail">Deepgram Nova-2 (2.3% WER)</text>

    <text x="16" y="112" class="font-base node-detail" font-weight="600" fill="#A5B4FC">Conversational LLM:</text>
    <text x="16" y="127" class="font-base node-detail">OpenAI GPT-4o Prompt</text>

    <text x="16" y="150" class="font-base node-detail" font-weight="600" fill="#A5B4FC">Text-to-Speech:</text>
    <text x="16" y="165" class="font-base node-detail">Elliot Voice (Natural TTS)</text>

    <text x="16" y="188" class="font-base node-detail" font-weight="600" fill="#A5B4FC">Tool Call Dispatch:</text>
    <text x="16" y="203" class="font-base node-detail">Emits JSON to n8n Webhook</text>
  </g>

  <!-- Caller <-> Vapi Audio Connection -->
  <line x1="150" y1="200" x2="150" y2="245" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <line x1="130" y1="245" x2="130" y2="200" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- ==================== SECTION 2: n8n BACKEND ORCHESTRATOR ==================== -->
  <rect x="290" y="80" width="770" height="560" rx="12" fill="#0F172A" fill-opacity="0.4" stroke="#EA580C" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <rect x="305" y="68" width="180" height="22" rx="4" fill="#9A3412"/>
  <text x="395" y="83" class="font-base badge" fill="#FFEDD5" text-anchor="middle">n8n WORKFLOW ENGINE</text>

  <!-- Webhook Node -->
  <g transform="translate(315, 110)" filter="url(#cardShadow)">
    <rect width="185" height="110" rx="8" fill="url(#n8nCard)" stroke="#F97316" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="28" cy="28" r="14" fill="#F97316" fill-opacity="0.2"/>
    <text x="28" y="32" class="font-base" font-size="14" text-anchor="middle">⚡</text>
    <text x="50" y="26" class="font-base node-title">Webhook Node</text>
    <text x="50" y="41" class="font-base node-sub">POST Endpoint</text>
    <text x="16" y="66" class="font-base node-detail">• /webhook/bcb238ed...</text>
    <text x="16" y="80" class="font-base node-detail">• Response: responseNode</text>
    <text x="16" y="94" class="font-base node-detail">• Ingests Vapi payload</text>
  </g>

  <!-- Vapi -> Webhook Arrow -->
  <path d="M 240 330 L 275 330 L 275 165 L 315 165" fill="none" stroke="#F97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="278" y="240" class="font-base edge-label" transform="rotate(-90 278 240)" text-anchor="middle">POST Tool Call JSON</text>

  <!-- Extract Tool Args Node (Code) -->
  <g transform="translate(315, 275)" filter="url(#cardShadow)">
    <rect width="185" height="150" rx="8" fill="url(#n8nCard)" stroke="#F97316" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="28" cy="28" r="14" fill="#F97316" fill-opacity="0.2"/>
    <text x="28" y="32" class="font-base" font-size="14" text-anchor="middle">💻</text>
    <text x="50" y="26" class="font-base node-title">Extract Tool Args</text>
    <text x="50" y="41" class="font-base node-sub">JavaScript Code Node</text>
    <line x1="16" y1="54" x2="169" y2="54" stroke="#9A3412" stroke-opacity="0.4"/>
    <text x="16" y="70" class="font-base node-detail">• toolCallId extraction</text>
    <text x="16" y="85" class="font-base node-detail">• Type (Search vs Viewing)</text>
    <text x="16" y="100" class="font-base node-detail">• Name, Email, Phone</text>
    <text x="16" y="115" class="font-base node-detail">• Viewing_Time &amp; Address</text>
    <text x="16" y="130" class="font-base node-detail">• Formats clean item object</text>
  </g>

  <!-- Webhook -> Extract Code Arrow -->
  <line x1="407" y1="220" x2="407" y2="275" stroke="#F97316" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- AI Agent Node (LangChain) -->
  <g transform="translate(545, 190)" filter="url(#cardShadow)">
    <rect width="215" height="195" rx="8" fill="url(#aiCard)" stroke="#0284C7" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#0284C7" fill-opacity="0.2"/>
    <text x="28" y="32" class="font-base" font-size="14" text-anchor="middle">🤖</text>
    <text x="50" y="26" class="font-base node-title">AI Agent</text>
    <text x="50" y="41" class="font-base node-sub">LangChain Agent v3.1</text>
    <line x1="16" y1="54" x2="199" y2="54" stroke="#0284C7" stroke-opacity="0.4"/>
    <text x="16" y="72" class="font-base node-detail" font-weight="600" fill="#38BDF8">Orchestration Logic:</text>
    <text x="16" y="88" class="font-base node-detail">• Evaluates caller intent</text>
    <text x="16" y="104" class="font-base node-detail">• Selects appropriate tool</text>
    <text x="16" y="120" class="font-base node-detail">• Validates parameter completeness</text>
    <text x="16" y="136" class="font-base node-detail">• Multi-step reasoning loop</text>
    <text x="16" y="152" class="font-base node-detail">• Formats output response</text>
    <rect x="16" y="165" width="183" height="18" rx="3" fill="#0369A1" fill-opacity="0.3"/>
    <text x="107" y="177.5" class="font-base badge" fill="#7DD3FC" text-anchor="middle">DECISION ENGINE</text>
  </g>

  <!-- Extract Code -> AI Agent Arrow -->
  <path d="M 500 350 L 522 350 L 522 287 L 545 287" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- OpenAI Model Subnode -->
  <g transform="translate(545, 415)" filter="url(#cardShadow)">
    <rect width="215" height="75" rx="8" fill="url(#aiCard)" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="12" fill="#0284C7" fill-opacity="0.2"/>
    <text x="24" y="28" class="font-base" font-size="12" text-anchor="middle">🧠</text>
    <text x="44" y="22" class="font-base node-title" font-size="13">OpenAI Chat Model</text>
    <text x="44" y="36" class="font-base node-sub">gpt-4.1-mini</text>
    <text x="16" y="58" class="font-base node-detail">• Low-latency tool-calling model</text>
  </g>

  <!-- Model -> Agent Link -->
  <line x1="652" y1="415" x2="652" y2="385" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- ==================== THREE TOOLS (RIGHT SIDE) ==================== -->
  
  <!-- Tool 1: Google Sheets Tool -->
  <g transform="translate(810, 110)" filter="url(#cardShadow)">
    <rect width="230" height="110" rx="8" fill="url(#toolCard)" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="28" cy="28" r="14" fill="#10B981" fill-opacity="0.2"/>
    <text x="28" y="32" class="font-base" font-size="14" text-anchor="middle">📊</text>
    <text x="50" y="26" class="font-base node-title">Google Sheets Tool</text>
    <text x="50" y="41" class="font-base node-sub">Property Database</text>
    <text x="16" y="66" class="font-base node-detail">• Live sheet query by address</text>
    <text x="16" y="80" class="font-base node-detail">• Returns: Price, Beds, Baths, SqFt</text>
    <text x="16" y="94" class="font-base node-detail">• Zero hallucination on facts</text>
  </g>

  <!-- Tool 2: Google Calendar Tool -->
  <g transform="translate(810, 245)" filter="url(#cardShadow)">
    <rect width="230" height="110" rx="8" fill="url(#toolCard)" stroke="#3B82F6" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="28" cy="28" r="14" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="28" y="32" class="font-base" font-size="14" text-anchor="middle">📅</text>
    <text x="50" y="26" class="font-base node-title">Google Calendar Tool</text>
    <text x="50" y="41" class="font-base node-sub">Viewing Appointment</text>
    <text x="16" y="66" class="font-base node-detail">• Auto-schedules confirmed slot</text>
    <text x="16" y="80" class="font-base node-detail">• Caller added as attendee invitee</text>
    <text x="16" y="94" class="font-base node-detail">• Location set to property address</text>
  </g>

  <!-- Tool 3: WhatsApp Tool -->
  <g transform="translate(810, 380)" filter="url(#cardShadow)">
    <rect width="230" height="110" rx="8" fill="url(#toolCard)" stroke="#22C55E" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="28" cy="28" r="14" fill="#22C55E" fill-opacity="0.2"/>
    <text x="28" y="32" class="font-base" font-size="14" text-anchor="middle">💬</text>
    <text x="50" y="26" class="font-base node-title">WhatsApp Business Tool</text>
    <text x="50" y="41" class="font-base node-sub">Agent Dispatch Alert</text>
    <text x="16" y="66" class="font-base node-detail">• Pushes instant booking alert</text>
    <text x="16" y="80" class="font-base node-detail">• Formatted caller dossier &amp; slot</text>
    <text x="16" y="94" class="font-base node-detail">• Directly to realtor's mobile</text>
  </g>

  <!-- AI Agent to Tools Arrows -->
  <path d="M 760 220 L 785 220 L 785 165 L 810 165" fill="none" stroke="#10B981" stroke-width="1.8" marker-end="url(#arrowEmerald)"/>
  <path d="M 760 287 L 810 287" fill="none" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <path d="M 760 340 L 785 340 L 785 435 L 810 435" fill="none" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrowEmerald)"/>

  <!-- Respond to Webhook Node -->
  <g transform="translate(545, 520)" filter="url(#cardShadow)">
    <rect width="495" height="95" rx="8" fill="url(#respCard)" stroke="#14B8A6" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#14B8A6" fill-opacity="0.2"/>
    <text x="28" y="32" class="font-base" font-size="14" text-anchor="middle">📤</text>
    <text x="50" y="26" class="font-base node-title">Respond to Webhook</text>
    <text x="50" y="41" class="font-base node-sub">Vapi JSON Response Formatter</text>
    <text x="16" y="66" class="font-base node-detail" fill="#5EEAD4">• Maps: { "results": [{ "toolCallId": toolCallId, "result": agentOutput }] }</text>
    <text x="16" y="82" class="font-base node-detail">• Resolves HTTP POST synchronously back to Vapi in &lt; 2 seconds</text>
  </g>

  <!-- Tools -> Response Connection -->
  <path d="M 652 385 L 652 520" fill="none" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrowEmerald)"/>

  <!-- Return to Vapi Voice Loop -->
  <path d="M 545 570 L 150 570 L 150 480" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrowIndigo)"/>
  <text x="320" y="560" class="font-base edge-label" fill="#A5B4FC">Synchronous Vapi Tool Response (Result Audio Spoken to Caller)</text>
</svg>
