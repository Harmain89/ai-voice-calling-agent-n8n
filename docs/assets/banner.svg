<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
    
    <!-- Accent Line Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="35%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Filter for subtle dropshadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 400; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #38BDF8; letter-spacing: 1px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #F8FAFC; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-size: 12.5px; fill: #94A3B8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 11px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" rx="16" fill="url(#glowIndigo)"/>
  <rect width="1200" height="400" rx="16" fill="url(#glowCyan)"/>
  <rect width="1200" height="400" rx="16" fill="url(#glowEmerald)"/>

  <!-- Border Frame -->
  <rect width="1198" height="398" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Decorative Grid Overlay -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="440" y1="0" x2="440" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="680" y1="0" x2="680" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="920" y1="0" x2="920" y2="400"/>
    <line x1="1040" y1="0" x2="1040" y2="400"/>
    <line x1="1160" y1="0" x2="1160" y2="400"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="380" x2="1200" y2="380"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Main Header Content -->
  <!-- Pill Badge -->
  <g transform="translate(60, 42)">
    <rect width="210" height="28" rx="14" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#38BDF8"/>
    <text x="28" y="18.5" class="badge-text">VOICE AUTOMATION</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="112" class="title" font-size="38">AI Voice Calling Agent</text>
  
  <!-- Subtitle -->
  <text x="60" y="145" class="subtitle" font-size="17">
    24/7 Autonomous Real Estate Receptionist &amp; Viewing Booking Pipeline
  </text>
  <text x="60" y="170" class="subtitle" font-size="14" fill="#64748B">
    Orchestrated by n8n &amp; OpenAI LangChain Agent · Driven by Vapi Voice AI · Syncs with Sheets, Calendar &amp; WhatsApp
  </text>

  <!-- Waveform Visual Accent (Right Side) -->
  <g transform="translate(930, 75)" opacity="0.9">
    <rect x="0" y="32" width="6" height="36" rx="3" fill="#6366F1" opacity="0.6"/>
    <rect x="14" y="20" width="6" height="60" rx="3" fill="#6366F1"/>
    <rect x="28" y="8" width="6" height="84" rx="3" fill="#818CF8"/>
    <rect x="42" y="28" width="6" height="44" rx="3" fill="#38BDF8"/>
    <rect x="56" y="0" width="6" height="100" rx="3" fill="#06B6D4"/>
    <rect x="70" y="18" width="6" height="64" rx="3" fill="#2DD4BF"/>
    <rect x="84" y="36" width="6" height="28" rx="3" fill="#10B981" opacity="0.7"/>
    <rect x="98" y="12" width="6" height="76" rx="3" fill="#34D399"/>
    <rect x="112" y="26" width="6" height="48" rx="3" fill="#38BDF8"/>
    <rect x="126" y="4" width="6" height="92" rx="3" fill="#6366F1"/>
    <rect x="140" y="24" width="6" height="52" rx="3" fill="#818CF8"/>
    <rect x="154" y="38" width="6" height="24" rx="3" fill="#A855F7" opacity="0.5"/>
    <circle cx="77" cy="115" r="3" fill="#06B6D4" opacity="0.8"/>
    <text x="77" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748B" text-anchor="middle" font-weight="600">LIVE AUDIO</text>
  </g>

  <!-- Feature Cards Row (3 Cards) -->
  <!-- Card 1: Property Search -->
  <g transform="translate(60, 205)" filter="url(#shadow)">
    <rect width="335" height="145" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="34" cy="36" r="16" fill="#3B82F6" fill-opacity="0.15"/>
    <!-- Search Icon -->
    <path d="M30 32 A 5 5 0 1 1 35 37 A 5 5 0 0 1 30 32 Z M34 36 L39 41" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="41" class="card-title">Live Property Search</text>
    <text x="24" y="76" class="card-desc">Instantly queries Google Sheets for</text>
    <text x="24" y="96" class="card-desc">pricing, bedrooms, sq footage, &amp; amenities</text>
    <text x="24" y="116" class="card-desc">with zero hallucinations.</text>
    <!-- Tag -->
    <rect x="238" y="112" width="82" height="20" rx="4" fill="#1E3A8A" fill-opacity="0.4"/>
    <text x="279" y="126" class="tag" fill="#93C5FD" text-anchor="middle">Google Sheets</text>
  </g>

  <!-- Card 2: Calendar Scheduling -->
  <g transform="translate(425, 205)" filter="url(#shadow)">
    <rect width="335" height="145" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="34" cy="36" r="16" fill="#10B981" fill-opacity="0.15"/>
    <!-- Calendar Icon -->
    <rect x="26" y="28" width="16" height="16" rx="2" fill="none" stroke="#34D399" stroke-width="1.8"/>
    <line x1="30" y1="25" x2="30" y2="28" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="38" y1="25" x2="38" y2="28" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="26" y1="33" x2="42" y2="33" stroke="#34D399" stroke-width="1.2"/>
    <text x="60" y="41" class="card-title">Automated Calendar Booking</text>
    <text x="24" y="76" class="card-desc">Gathers name, email, phone &amp; slot;</text>
    <text x="24" y="96" class="card-desc">creates Google Calendar invite with caller</text>
    <text x="24" y="116" class="card-desc">added as an attendee automatically.</text>
    <!-- Tag -->
    <rect x="230" y="112" width="90" height="20" rx="4" fill="#064E3B" fill-opacity="0.4"/>
    <text x="275" y="126" class="tag" fill="#6EE7B7" text-anchor="middle">Google Calendar</text>
  </g>

  <!-- Card 3: WhatsApp Alert -->
  <g transform="translate(790, 205)" filter="url(#shadow)">
    <rect width="350" height="145" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="34" cy="36" r="16" fill="#22C55E" fill-opacity="0.15"/>
    <!-- WhatsApp Icon -->
    <path d="M26 36 C26 31 30 27 35 27 C40 27 44 31 44 36 C44 41 40 45 35 45 C33.5 45 32 44.5 30.8 43.8 L26 45 L27.2 40.5 C26.4 39.2 26 37.6 26 36 Z" fill="none" stroke="#4ADE80" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="60" y="41" class="card-title">Instant WhatsApp Dispatch</text>
    <text x="24" y="76" class="card-desc">Pushes formatted viewing summaries</text>
    <text x="24" y="96" class="card-desc">directly to the agent's phone via</text>
    <text x="24" y="116" class="card-desc">WhatsApp Business API in real-time.</text>
    <!-- Tag -->
    <rect x="248" y="112" width="88" height="20" rx="4" fill="#14532D" fill-opacity="0.4"/>
    <text x="292" y="126" class="tag" fill="#86EFAC" text-anchor="middle">WhatsApp API</text>
  </g>

  <!-- Footer Stats bar -->
  <g transform="translate(60, 375)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B" font-weight="500">
      ⚡ &lt; 2s End-to-End Latency  ·  💵 ~$0.11 / Min Call Cost  ·  🤖 OpenAI GPT-4.1-mini &amp; LangChain Agent  ·  📞 Vapi Voice Stack
    </text>
  </g>
</svg>
