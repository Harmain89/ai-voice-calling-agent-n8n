<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <linearGradient id="stepBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="branchGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="branchPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A78BFA"/>
    </marker>

    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .heading { font-size: 19px; font-weight: 700; fill: #F8FAFC; }
    .subheading { font-size: 13px; font-weight: 400; fill: #94A3B8; }
    .box-title { font-size: 13.5px; font-weight: 700; fill: #F8FAFC; }
    .box-desc { font-size: 11.5px; font-weight: 400; fill: #94A3B8; }
    .badge-flow { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
  </style>

  <!-- Background -->
  <rect width="1000" height="520" rx="14" fill="url(#flowBg)" stroke="#334155" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" class="txt heading">Conversational Decision Logic &amp; Dual-Intent Flow</text>
    <text x="0" y="20" class="txt subheading">How the LangChain Agent distinguishes property lookups from viewing bookings in real time</text>
  </g>

  <!-- Step 1: Inbound Call -->
  <g transform="translate(40, 85)" filter="url(#shadowBox)">
    <rect width="200" height="110" rx="8" fill="url(#stepBox)" stroke="#6366F1" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="26" cy="26" r="12" fill="#6366F1" fill-opacity="0.25"/>
    <text x="26" y="30" class="txt" font-size="12" text-anchor="middle">1</text>
    <text x="46" y="26" class="txt box-title">Customer Rings</text>
    <text x="46" y="40" class="txt box-desc">Voice Connection</text>
    <line x1="14" y1="52" x2="186" y2="52" stroke="#334155" stroke-opacity="0.6"/>
    <text x="14" y="70" class="txt box-desc">• Inbound call picked up</text>
    <text x="14" y="86" class="txt box-desc">• Vapi greets caller in &lt;1s</text>
    <text x="14" y="100" class="txt box-desc">• STT transcribes prompt</text>
  </g>

  <!-- Step 2: Vapi Tool Trigger -->
  <g transform="translate(280, 85)" filter="url(#shadowBox)">
    <rect width="200" height="110" rx="8" fill="url(#stepBox)" stroke="#0284C7" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="26" cy="26" r="12" fill="#0284C7" fill-opacity="0.25"/>
    <text x="26" y="30" class="txt" font-size="12" text-anchor="middle">2</text>
    <text x="46" y="26" class="txt box-title">Vapi Tool Trigger</text>
    <text x="46" y="40" class="txt box-desc">Payload Generation</text>
    <line x1="14" y1="52" x2="186" y2="52" stroke="#334155" stroke-opacity="0.6"/>
    <text x="14" y="70" class="txt box-desc">• Intent classified by Vapi</text>
    <text x="14" y="86" class="txt box-desc">• toolCallId &amp; args bound</text>
    <text x="14" y="100" class="txt box-desc">• Dispatched to n8n URL</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="240" y1="140" x2="280" y2="140" stroke="#38BDF8" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- Step 3: Decision Engine Node (Center) -->
  <g transform="translate(520, 85)" filter="url(#shadowBox)">
    <rect width="200" height="110" rx="8" fill="url(#stepBox)" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="1.4"/>
    <circle cx="26" cy="26" r="12" fill="#F59E0B" fill-opacity="0.25"/>
    <text x="26" y="30" class="txt" font-size="12" text-anchor="middle">3</text>
    <text x="46" y="26" class="txt box-title">AI Agent Decision</text>
    <text x="46" y="40" class="txt box-desc">LangChain + GPT-4.1-mini</text>
    <line x1="14" y1="52" x2="186" y2="52" stroke="#334155" stroke-opacity="0.6"/>
    <text x="14" y="70" class="txt box-desc">• Inspects toolCallType</text>
    <text x="14" y="86" class="txt box-desc">• Checks required args</text>
    <text x="14" y="100" class="txt box-desc" fill="#FBBF24" font-weight="600">Routes to appropriate path</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="480" y1="140" x2="520" y2="140" stroke="#38BDF8" stroke-width="2" marker-end="url(#flowArrow)"/>

  <!-- ==================== BRANCH A: PROPERTY INQUIRY ==================== -->
  <!-- Label Branch A -->
  <rect x="750" y="75" width="210" height="24" rx="4" fill="#065F46"/>
  <text x="855" y="91" class="txt badge-flow" fill="#A7F3D0" text-anchor="middle">PATH A: PROPERTY INQUIRY</text>

  <!-- Box A1: Google Sheets Lookup -->
  <g transform="translate(750, 110)" filter="url(#shadowBox)">
    <rect width="210" height="130" rx="8" fill="url(#stepBox)" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="16" y="26" class="txt box-title">1. Query Google Sheet</text>
    <text x="16" y="46" class="txt box-desc">• Matches address query</text>
    <text x="16" y="64" class="txt box-desc">• Pulls live bedrooms, baths,</text>
    <text x="16" y="80" class="txt box-desc">  sq footage &amp; price</text>
    <text x="16" y="98" class="txt box-desc">• Returns structured record</text>
    <rect x="16" y="108" width="178" height="14" rx="2" fill="#064E3B" fill-opacity="0.5"/>
    <text x="105" y="119" class="txt" font-size="9" fill="#6EE7B7" text-anchor="middle">ZERO HALLUCINATIONS</text>
  </g>

  <!-- Branch A Arrow -->
  <path d="M 720 125 L 750 125" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#branchGreen)"/>

  <!-- ==================== BRANCH B: VIEWING BOOKING ==================== -->
  <!-- Label Branch B -->
  <rect x="280" y="245" width="210" height="24" rx="4" fill="#581C87"/>
  <text x="385" y="261" class="txt badge-flow" fill="#DDD6FE" text-anchor="middle">PATH B: VIEWING BOOKING</text>

  <!-- Branch B Arrow from Node 3 -->
  <path d="M 620 195 L 620 310 L 520 310" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#branchPurple)"/>

  <!-- Box B1: Calendar Scheduling -->
  <g transform="translate(280, 280)" filter="url(#shadowBox)">
    <rect width="225" height="135" rx="8" fill="url(#stepBox)" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="16" y="26" class="txt box-title">1. Google Calendar Event</text>
    <text x="16" y="46" class="txt box-desc">• Parses Start &amp; End time</text>
    <text x="16" y="64" class="txt box-desc">• Caller email added as attendee</text>
    <text x="16" y="80" class="txt box-desc">• Property address set as venue</text>
    <text x="16" y="98" class="txt box-desc">• Description: Full caller details</text>
    <rect x="16" y="112" width="193" height="14" rx="2" fill="#4C1D95" fill-opacity="0.5"/>
    <text x="112" y="123" class="txt" font-size="9" fill="#C4B5FD" text-anchor="middle">AUTO-CALENDAR INVITE</text>
  </g>

  <!-- Box B2: WhatsApp Notification -->
  <g transform="translate(540, 280)" filter="url(#shadowBox)">
    <rect width="225" height="135" rx="8" fill="url(#stepBox)" stroke="#22C55E" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="16" y="26" class="txt box-title">2. WhatsApp Push Alert</text>
    <text x="16" y="46" class="txt box-desc">• Targets Agent mobile number</text>
    <text x="16" y="64" class="txt box-desc">• Sends Lead Dossier:</text>
    <text x="24" y="80" class="txt box-desc">Name, Phone, Email,</text>
    <text x="24" y="96" class="txt box-desc">Property &amp; Confirmed Time</text>
    <rect x="16" y="112" width="193" height="14" rx="2" fill="#14532D" fill-opacity="0.5"/>
    <text x="112" y="123" class="txt" font-size="9" fill="#86EFAC" text-anchor="middle">REAL-TIME DISPATCH</text>
  </g>

  <!-- Arrow B1 -> B2 -->
  <line x1="505" y1="347" x2="540" y2="347" stroke="#22C55E" stroke-width="2" marker-end="url(#branchGreen)"/>

  <!-- ==================== FINAL RESPONSE BOX ==================== -->
  <g transform="translate(40, 435)" filter="url(#shadowBox)">
    <rect width="920" height="65" rx="8" fill="#134E4A" fill-opacity="0.3" stroke="#14B8A6" stroke-opacity="0.6" stroke-width="1.2"/>
    <circle cx="28" cy="32" r="14" fill="#14B8A6" fill-opacity="0.2"/>
    <text x="28" y="36" class="txt" font-size="14" text-anchor="middle">⚡</text>
    <text x="52" y="27" class="txt box-title" fill="#5EEAD4">Final Voice Response Loop (Under 2 Seconds)</text>
    <text x="52" y="46" class="txt box-desc" fill="#CCFBF1">The formatted tool result is returned to Vapi's webhook, converted to speech by Elliot TTS, and spoken to the caller in real-time.</text>
  </g>

  <!-- Connect Path A to Final Response -->
  <path d="M 855 240 L 855 435" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Connect Path B to Final Response -->
  <path d="M 652 415 L 652 435" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
